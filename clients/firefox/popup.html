<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #09090b;
      color: #fafafa;
      padding: 16px;
    }
    h1 {
      font-size: 16px;
      font-weight: 700;
      margin-bottom: 12px;
    }
    label {
      display: block;
      font-size: 11px;
      color: #a1a1aa;
      margin-bottom: 4px;
    }
    input {
      width: 100%;
      padding: 8px;
      border: 1px solid #27272a;
      border-radius: 6px;
      background: #18181b;
      color: #fafafa;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #3b82f6; }
    button {
      width: 100%;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: #3b82f6;
      color: white;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
    }
    button:hover { background: #2563eb; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .field { margin-bottom: 12px; }
    .status {
      font-size: 12px;
      padding: 6px 8px;
      border-radius: 6px;
      margin-top: 8px;
    }
    .status.ok { background: #052e16; color: #22c55e; }
    .status.err { background: #450a0a; color: #ef4444; }
    .badge {
      font-size: 12px;
      color: #a1a1aa;
      text-align: center;
      margin-top: 12px;
    }
  </style>
</head>
<body>
  <h1>DAL</h1>

  <div class="field">
    <label>Server URL</label>
    <input type="url" id="serverUrl" placeholder="http://localhost:8550">
  </div>

  <div class="field">
    <label>Queue a URL</label>
    <input type="url" id="urlInput" placeholder="Paste a URL...">
  </div>

  <button id="queueBtn" disabled>Queue Download</button>

  <div id="status" class="status" style="display:none"></div>
  <div id="badge" class="badge"></div>

  <script src="popup.js"></script>
</body>
</html>
